name: Validate and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate toolbar assets
        run: node scripts/generate-frames.mjs

      - name: Check generated files
        run: git diff --exit-code -- img src

      - name: Validate theme
        run: node scripts/validate.mjs

      - name: Run Mozilla add-on lint
        run: >-
          npx --yes web-ext@10.6.0 lint --source-dir .
          --ignore-files "docs/**" "screen_light.png" "screen_dark.png"
          "src/**" "scripts/**" ".github/**" "dist/**"
          "README.md" "LICENSE" ".gitignore"

      - name: Package theme
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aerofoil-theme
          path: dist/*.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --verify-tag
